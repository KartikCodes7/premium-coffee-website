<!-- Login Form -->
<form class="space-y-8" onsubmit="return false">
<!-- Email Input -->
<div class="group reveal-delay-1 stagger-reveal">

<!-- Password Input -->
<div class="group reveal-delay-2 stagger-reveal">
<div class="flex justify-between items-end mb-2">
<label class="font-label-mono text-on-secondary-container text-xs uppercase tracking-tighter">

<a class="font-label-mono text-primary text-[10px] uppercase tracking-wider hover:opacity-80 transition-opacity" href="#">

<!-- Interactive Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mouse Parallax effect for the background
            document.addEventListener('mousemove', (e) => {
                const bg = document.querySelector('.fixed img');
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                bg.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
            });

            // Input interactions
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('scale-[1.01]');
                    input.parentElement.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('scale-[1.01]');
                });
            });

            // Form submission simulation
            const btn = document.querySelector('button');
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
                btn.classList.add('opacity-80');
                
                setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Access Granted';
                    btn.classList.replace('bg-primary', 'bg-green-500');
                    btn.classList.replace('text-on-primary', 'text-white');
                }, 1500);
            });
        });
    </script>
